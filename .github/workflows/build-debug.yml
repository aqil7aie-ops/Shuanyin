name: Build Shuanyin expDebug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build expDebug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Install web UI dependencies
        working-directory: web-ui
        run: npm ci

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned NDK
        run: sdkmanager --install "ndk;28.2.13676358"

      - name: Configure the supplied expDebug dummy Firebase options
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/exp
          cat > app/src/exp/google-services.json <<'JSON'
          {"client":[{"api_key":[{"current_key":"dummy-key-for-local-builds"}],"client_info":{"android_client_info":{"package_name":"com.aqeel.shuanyin.exp"},"mobilesdk_app_id":"1:000000000000:android:0000000000000000"},"oauth_client":[],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1","project_info":{"project_id":"shuanyin-dummy","project_number":"000000000000","storage_bucket":"shuanyin-dummy.appspot.com"}}
          JSON

      - name: Build expDebug APK
        run: ./gradlew :app:assembleExpDebug --no-daemon --max-workers=2 --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shuanyin-exp-debug-${{ github.run_number }}
          path: app/build/outputs/apk/exp/debug/*.apk
          if-no-files-found: error
          retention-days: 14
